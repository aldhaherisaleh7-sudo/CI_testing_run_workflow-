name: testing
on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  run_test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
       image: mysql:latest
       env:
         MYSQL_ROOT_PASSWORD: password
         MYSQL_DATABASE: testing
       ports:
         - 3306:3306
       options: >-
        --health-cmd="mysqladmin ping"
        --health-interval=10s
        --health-timeout=5s
        --health-retries=3  

    steps:
      - name: checkout_code
        uses: actions/checkout@v4

      - name: setup_php
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      
      - name: install_dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: copy_env
        run: cp .env.example .env

      - name: generate_key
        run: php artisan key:generate

      - name: run_tests
        run: php artisan test
        env:
            DB_CONNECTION: mysql
            DB_HOST: 127.0.0.1
            DB_PORT: 3306
            DB_DATABASE: testing
            DB_USERNAME: root
            DB_PASSWORD: password
